<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学习台 · 清单</title>
<meta name="description" content="个人学习台：清单记学到哪一步，速记随手扔灵感，成果对外展示。">

<!-- 装到桌面用：这三个 meta 决定安卓/iOS 打开时是否隐藏地址栏 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F4EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习台">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="../assets/shell.css">
<link rel="stylesheet" href="assets/list.css">
</head>
<body data-page="desk">

<!-- 阅读进度：贴在站点顶栏下沿的一条细线 -->
<div class="prog" id="prog" aria-hidden="true"></div>

<div class="wrap">

  <header>
    <div class="kicker st" style="--i:0" id="kicker">学习台 · 自己定结构</div>
    <div class="hero-row st" style="--i:1">
      <h1 id="title">清单</h1>
      <div class="hero-meta">最近修改<br><b id="updated">—</b></div>
    </div>
    <p class="sub st" style="--i:2" id="sub"></p>
  </header>

  <nav class="tabs st" style="--i:3" id="tabs" aria-label="视图">
    <a class="tab" href="#/list" data-view="list">清单</a>
    <a class="tab" href="#/scratch" data-view="scratch">速记</a>
    <a class="tab" href="#/works" data-view="works">成果</a>
    <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
  </nav>

  <div class="stats st" style="--i:4" id="stats"></div>

  <div class="toolbar st" style="--i:5" id="toolbar"></div>

  <main id="main"></main>

  <div class="foot st" style="--i:6" id="foot"></div>
</div>

<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data/content.js"></script>
<script src="assets/list.js"></script>
<script src="../assets/shell.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>首页 · 学习台</title>
<meta name="description" content="个人站点：学习清单与进度、速记草稿、笔记库浏览。">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/shell.css">
<style>
  :root{
    --bg:#FAF8F3; --card:#FFFFFF; --line:#E6E4DD; --line-2:#D3D1C7;
    --ink:#2C2C2A; --ink-2:#5F5E5A; --ink-3:#8B8A84;
    --fin:#2F5D50; --lang:#9A6B3F; --cs:#3D4F8C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(48px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}

  .hero{padding:56px 0 34px}
  .kicker{
    margin:0 0 10px; font-size:12px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-3);
  }
  h1{margin:0; font-size:30px; font-weight:600; letter-spacing:-.01em; line-height:1.25}
  .sub{margin:12px 0 0; color:var(--ink-2); max-width:560px}

  .cards{
    display:grid; grid-template-columns:repeat(2,1fr);
    gap:14px; padding-bottom:40px;
  }
  .card{
    display:flex; flex-direction:column;
    padding:20px 20px 18px;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; text-decoration:none; color:inherit;
    transition:border-color .16s, transform .16s;
  }
  .card:hover{border-color:var(--line-2); transform:translateY(-1px)}
  .card-top{display:flex; align-items:center; gap:9px}
  .dot{width:9px;height:9px;border-radius:2.5px;flex:none}
  .card h2{margin:0; font-size:16px; font-weight:600}
  .card p{margin:9px 0 0; font-size:13.5px; color:var(--ink-2)}
  .card .tags{margin-top:14px; display:flex; flex-wrap:wrap; gap:6px}
  .tag{
    padding:2px 8px; border:1px solid var(--line-2); border-radius:6px;
    font-size:11.5px; color:var(--ink-3); background:#FCFBF8;
  }

  .card.ghost{
    border-style:dashed; background:transparent; color:var(--ink-3);
    cursor:default;
  }
  .card.ghost:hover{transform:none; border-color:var(--line-2)}
  .card.ghost h2{color:var(--ink-2)}
  .card.ghost code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px; color:var(--ink-2);
    background:#F1EFE8; padding:1px 5px; border-radius:4px;
  }

  footer{
    padding:22px 0 10px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-3);
  }

  @media (max-width:640px){
    .hero{padding:36px 0 26px}
    h1{font-size:25px}
    .cards{grid-template-columns:1fr}
  }
</style>
</head>
<body data-page="home">

<main class="wrap">

  <section class="hero">
    <p class="kicker">王爱民 · 个人站点</p>
    <h1>金融 · 外语 · AI</h1>
    <p class="sub">三条腿走路。这里是入口，每个板块都是独立页面，样式和功能互不干涉。</p>
  </section>

  <section class="cards">

    <a class="card" href="desk/index.html">
      <div class="card-top">
        <span class="dot" style="background:var(--fin)"></span>
        <h2>学习台</h2>
      </div>
      <p>清单、速记、成果。勾进度，随手记两笔，等有空再整理。</p>
      <div class="tags">
        <span class="tag">清单</span>
        <span class="tag">速记</span>
        <span class="tag">成果</span>
        <span class="tag">可装到桌面</span>
      </div>
    </a>

    <a class="card" href="notes.html">
      <div class="card-top">
        <span class="dot" style="background:var(--lang)"></span>
        <h2>笔记库</h2>
      </div>
      <p>只读浏览 GitHub 私有仓库里的 Markdown。数据在你自己的库里，网页存不了东西。</p>
      <div class="tags">
        <span class="tag">Markdown</span>
        <span class="tag">双链</span>
        <span class="tag">只读</span>
        <span class="tag">需填令牌</span>
      </div>
    </a>

    <div class="card ghost">
      <div class="card-top">
        <span class="dot" style="background:var(--line-2)"></span>
        <h2>＋ 新板块</h2>
      </div>
      <p>新建一个 <code>xxx.html</code>，在 <code>assets/shell.js</code> 的 <code>NAV</code> 里加一行，导航就多一项。其他文件不用动。</p>
    </div>

  </section>

  <footer>
    所有数据都在你自己的设备或 GitHub 仓库里，这个站没有后端。
  </footer>

</main>

<script src="assets/shell.js"></script>
</body>
</html>
